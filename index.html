<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小狗汪汪 · 温馨黄色系恋爱养成</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Segoe UI', 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
    }
    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #FFF6D5 0%, #FFE9A8 50%, #FFD966 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .game-container {
      width: 850px;
      max-width: 100%;
      background: #FFFDF2;
      border-radius: 60px 60px 40px 40px;
      box-shadow: 0 25px 40px rgba(200, 160, 40, 0.35), inset 0 0 0 2px #FFF9E0, inset 0 0 0 6px #FFE9A8;
      padding: 24px 28px 34px;
      transition: all 0.2s;
      border: 3px solid #FFD966;
    }
    .scene-box {
      background: #FFFBE8;
      border-radius: 44px 44px 32px 32px;
      padding: 18px 16px 10px;
      box-shadow: inset 0 8px 12px rgba(230, 200, 100, 0.25), inset 0 -4px 8px rgba(255, 250, 220, 0.9);
      border: 2px solid #FFE28A;
    }
    .scene-title {
      text-align: center;
      font-size: 1.4rem;
      font-weight: 700;
      color: #B8860B;
      letter-spacing: 4px;
      margin-bottom: 8px;
      text-shadow: 0 2px 0 #FFF6D5, 0 0 12px #FFE9A8;
    }
    .illustration {
      background: linear-gradient(180deg, #FFF9E0 0%, #FFF3C4 100%);
      border-radius: 36px;
      padding: 12px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 0 3px #FFFDF2, 0 10px 16px #E6C86E;
      margin-bottom: 16px;
      border: 2px solid #FFE28A;
    }
    .character-sprite {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 260px;
      transition: all 0.3s ease;
    }
    .svg-illustration {
      width: 100%;
      max-width: 380px;
      height: auto;
      margin: 0 auto;
      display: block;
      filter: drop-shadow(0 10px 8px rgba(200, 150, 40, 0.3));
    }
    .message-box {
      background: #FFF6D5;
      padding: 16px 22px;
      border-radius: 40px;
      font-size: 1.15rem;
      color: #7A5A1E;
      text-align: center;
      box-shadow: inset 0 2px 10px #FFE9A8, 0 6px 0 #E6C86E;
      border: 2px solid #FFE28A;
      min-height: 85px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 8px 0 22px;
      font-weight: 600;
      line-height: 1.5;
      letter-spacing: 0.3px;
    }
    .stats {
      display: flex;
      gap: 18px;
      justify-content: center;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .stat {
      background: #FFECB3;
      padding: 8px 26px;
      border-radius: 60px;
      color: #7A5A1E;
      font-weight: 700;
      font-size: 1.1rem;
      box-shadow: inset 0 -2px 0 #E6C86E, 0 4px 0 #C9A63B;
      border: 2px solid #FFF6D5;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .stat span {
      font-size: 1.5rem;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-top: 10px;
    }
    .btn {
      background: #FFE28A;
      border: none;
      border-radius: 60px;
      padding: 14px 26px;
      font-size: 1.1rem;
      font-weight: 700;
      color: #6B4E0A;
      box-shadow: 0 7px 0 #C9A63B, 0 4px 10px rgba(200, 160, 40, 0.4);
      cursor: pointer;
      transition: all 0.08s linear;
      border: 2px solid #FFFDF2;
      letter-spacing: 1px;
      flex: 1 0 150px;
      text-shadow: 0 1px 0 #FFF6D5;
    }
    .btn:active {
      transform: translateY(5px);
      box-shadow: 0 2px 0 #C9A63B;
    }
    .btn-love {
      background: #FFD966;
      box-shadow: 0 7px 0 #C9A63B, 0 4px 10px rgba(200, 160, 40, 0.45);
      color: #6B3E0A;
    }
    .btn-love:active {
      box-shadow: 0 2px 0 #C9A63B;
    }
    .btn-special {
      background: #FFC857;
      box-shadow: 0 7px 0 #B8860B, 0 4px 10px rgba(180, 130, 20, 0.4);
      color: #4A3200;
    }
    .btn-special:active {
      box-shadow: 0 2px 0 #B8860B;
    }
    .reset-btn {
      background: #FFF0B5;
      box-shadow: 0 5px 0 #D4B45A;
      color: #7A5A1E;
      font-size: 0.9rem;
      padding: 10px 18px;
      flex: 0.4 1 80px;
      margin-left: auto;
    }
    .footer {
      display: flex;
      align-items: center;
      margin-top: 10px;
      gap: 10px;
    }
    .tiny-note {
      font-size: 0.7rem;
      color: #C9A63B;
      margin-left: 6px;
      font-weight: 600;
    }
  </style>
</head>
<body>
<div class="game-container" id="gameContainer">
  <div class="scene-box">
    <div class="scene-title" id="sceneTitle">🐶 小狗汪汪 · 温暖的小家</div>
    <div class="illustration" id="illustration">
      <div class="character-sprite" id="characterSprite">
        <!-- SVG 动态渲染位置 -->
      </div>
    </div>
    <div class="message-box" id="messageBox">汪！今天想和我一起玩吗？💛</div>

    <div class="stats" id="statsPanel">
      <div class="stat"><span>❤️</span> 好感 <span id="affectionValue">0</span></div>
      <div class="stat"><span>🍖</span> 饱食 <span id="hungerValue">50</span></div>
      <div class="stat"><span>🧼</span> 清洁 <span id="cleanValue">50</span></div>
    </div>

    <div class="actions" id="actionPanel">
    </div>
    <div class="footer">
      <button class="btn reset-btn" id="resetBtn">🔄 重新开始</button>
      <div class="tiny-note">🐕 → 👦 → 💛 从狗狗到恋人</div>
    </div>
  </div>
</div>

<script>
  const state = {
    phase: 'puppy',
    affection: 0,
    hunger: 50,
    clean: 50,
    transformed: false,
    kissUnlocked: false,
  };

  let isTransforming = false;

  const sceneTitle = document.getElementById('sceneTitle');
  const characterSprite = document.getElementById('characterSprite');
  const messageBox = document.getElementById('messageBox');
  const affectionValue = document.getElementById('affectionValue');
  const hungerValue = document.getElementById('hungerValue');
  const cleanValue = document.getElementById('cleanValue');
  const actionPanel = document.getElementById('actionPanel');
  const resetBtn = document.getElementById('resetBtn');

  const clamp = (num, min = 0, max = 100) => Math.min(max, Math.max(min, num));

  function updateStatsUI() {
    affectionValue.textContent = Math.floor(state.affection);
    hungerValue.textContent = Math.floor(state.hunger);
    cleanValue.textContent = Math.floor(state.clean);
  }

  function checkTransformation() {
    if (state.phase === 'puppy' && !state.transformed &&
        state.affection >= 70 && state.hunger >= 60 && state.clean >= 60 &&
        !isTransforming) {
      transformToHuman();
      return true;
    }
    return false;
  }

  function transformToHuman() {
    if (isTransforming) return;
    isTransforming = true;
    state.phase = 'human';
    state.transformed = true;
    state.affection = Math.min(100, state.affection + 10);
    sceneTitle.textContent = '🌟 他变成了人 · 恋爱开始';
    messageBox.textContent = '我……变成人类了？因为我太喜欢你了……想用人类的身份继续陪在你身边。💛';
    updateStatsUI();
    renderScene();
    isTransforming = false;
  }

  function feed() {
    if (state.phase !== 'puppy') return;
    state.hunger = clamp(state.hunger + 18);
    state.affection = clamp(state.affection + 5);
    messageBox.textContent = '小金毛开心地吃着狗粮，尾巴摇成螺旋桨～ 饱食+18 好感+5 🍖';
    updateStatsUI();
    checkTransformation();
    renderScene();
  }

  function bath() {
    if (state.phase !== 'puppy') return;
    state.clean = clamp(state.clean + 22);
    state.affection = clamp(state.affection + 6);
    state.hunger = clamp(state.hunger - 5);
    messageBox.textContent = '洗香香！小金毛甩着水珠，变得干净又蓬松。清洁+22 好感+6 🧼';
    updateStatsUI();
    checkTransformation();
    renderScene();
  }

  function play() {
    if (state.phase !== 'puppy') return;
    state.affection = clamp(state.affection + 10);
    state.hunger = clamp(state.hunger - 8);
    state.clean = clamp(state.clean - 12);
    messageBox.textContent = '你扔出小球，小金毛飞奔捡回来！好感+10 饱食-8 清洁-12 🎾';
    updateStatsUI();
    checkTransformation();
    renderScene();
  }

  function pet() {
    if (state.phase !== 'puppy') return;
    state.affection = clamp(state.affection + 8);
    messageBox.textContent = '你轻轻抚摸小金毛，它舒服地眯起眼睛。好感+8 🤚';
    updateStatsUI();
    checkTransformation();
    renderScene();
  }

  function kiss() {
    if (state.phase !== 'human') return;
    if (state.affection >= 85) {
      state.affection = clamp(state.affection + 6);
      messageBox.textContent = '💋 他红着脸，轻轻吻了你。心跳加速…… “我会一直一直喜欢你。” 好感+6';
    } else {
      state.affection = clamp(state.affection + 8);
      messageBox.textContent = '💋 你主动亲吻了他！他惊讶地睁大眼睛，随后温柔地抱住你。好感+8';
    }
    updateStatsUI();
    renderScene();
  }

  function hug() {
    if (state.phase !== 'human') return;
    state.affection = clamp(state.affection + 5);
    messageBox.textContent = '你拥抱了他，他耳朵尖微微发红，手臂却收得更紧。好感+5 🤗';
    updateStatsUI();
    renderScene();
  }

  function patHead() {
    if (state.phase !== 'human') return;
    state.affection = clamp(state.affection + 4);
    messageBox.textContent = '你揉了揉他的头发，他像以前当小狗时那样蹭了蹭你的手心。好感+4 ✨';
    updateStatsUI();
    renderScene();
  }

  function changeHabit() {
    if (state.phase !== 'human') return;
    if (state.affection >= 60) {
      state.affection = clamp(state.affection + 7);
      messageBox.textContent = '你教他改掉狗狗的习惯，他反而调皮地轻咬你指尖：“汪…还是忍不住想黏着你。” 好感+7 🐕';
    } else {
      messageBox.textContent = '他还有点害羞，不太愿意改变狗狗习性…… 再多培养感情吧。💛';
    }
    updateStatsUI();
    renderScene();
  }

  function resetGame() {
    state.phase = 'puppy';
    state.affection = 0;
    state.hunger = 50;
    state.clean = 50;
    state.transformed = false;
    state.kissUnlocked = false;
    isTransforming = false;
    sceneTitle.textContent = '🐶 小狗汪汪 · 温暖的小家';
    messageBox.textContent = '汪！今天想和我一起玩吗？💛';
    updateStatsUI();
    renderScene();
  }

  function renderButtons() {
    actionPanel.innerHTML = '';
    if (state.phase === 'puppy') {
      const buttons = [
        { text: '🍖 喂食', action: feed, class: '' },
        { text: '🧼 洗澡', action: bath, class: '' },
        { text: '🎾 玩耍', action: play, class: '' },
        { text: '🤚 抚摸', action: pet, class: '' }
      ];
      buttons.forEach(btn => {
        const b = document.createElement('button');
        b.className = `btn ${btn.class}`;
        b.textContent = btn.text;
        b.addEventListener('click', btn.action);
        actionPanel.appendChild(b);
      });
    } else {
      const buttons = [
        { text: '💋 亲吻', action: kiss, class: 'btn-love' },
        { text: '🤗 拥抱', action: hug, class: '' },
        { text: '✨ 摸头', action: patHead, class: '' },
        { text: '🐕 改掉狗狗习性', action: changeHabit, class: 'btn-special' }
      ];
      buttons.forEach(btn => {
        const b = document.createElement('button');
        b.className = `btn ${btn.class}`;
        b.textContent = btn.text;
        b.addEventListener('click', btn.action);
        actionPanel.appendChild(b);
      });
    }
  }

  function renderCharacter() {
    if (state.phase === 'puppy') {
      // 精修版小狗立绘 —— 蓬松金毛，水汪汪大眼，粉嫩舌头
      characterSprite.innerHTML = `
        <svg class="svg-illustration" viewBox="0 0 340 300" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="puppyBody" cx="50%" cy="40%" r="60%">
              <stop offset="0%" stop-color="#FFE9A8"/>
              <stop offset="70%" stop-color="#F5D98A"/>
              <stop offset="100%" stop-color="#E6C86E"/>
            </radialGradient>
            <radialGradient id="puppyHead" cx="50%" cy="35%" r="60%">
              <stop offset="0%" stop-color="#FFF0C0"/>
              <stop offset="70%" stop-color="#F5D98A"/>
              <stop offset="100%" stop-color="#E0B85A"/>
            </radialGradient>
            <radialGradient id="puppyEar" cx="50%" cy="50%" r="60%">
              <stop offset="0%" stop-color="#F0D27A"/>
              <stop offset="100%" stop-color="#D4A84A"/>
            </radialGradient>
            <radialGradient id="puppyEye" cx="35%" cy="30%" r="70%">
              <stop offset="0%" stop-color="#8B6B2A"/>
              <stop offset="40%" stop-color="#5A3E0A"/>
              <stop offset="100%" stop-color="#2A1C05"/>
            </radialGradient>
            <radialGradient id="puppyNose" cx="40%" cy="30%" r="70%">
              <stop offset="0%" stop-color="#8B6B2A"/>
              <stop offset="100%" stop-color="#3D2B0A"/>
            </radialGradient>
            <radialGradient id="puppyTongue" cx="50%" cy="30%" r="60%">
              <stop offset="0%" stop-color="#FFC0D0"/>
              <stop offset="100%" stop-color="#FF8FA8"/>
            </radialGradient>
          </defs>

          <!-- 尾巴（蓬松） -->
          <path d="M255 175 Q290 140 275 100 Q270 95 260 100 Q265 135 245 165 Z" fill="url(#puppyEar)" stroke="#C9A63B" stroke-width="2.5"/>
          <path d="M258 170 Q280 145 270 115" stroke="#FFF0C0" stroke-width="3" fill="none" opacity="0.6"/>

          <!-- 身体 -->
          <ellipse cx="170" cy="215" rx="80" ry="58" fill="url(#puppyBody)" stroke="#C9A63B" stroke-width="3"/>
          <!-- 肚子绒毛 -->
          <ellipse cx="170" cy="235" rx="52" ry="32" fill="#FFF9E0" stroke="#E0C070" stroke-width="2"/>
          <!-- 胸口蓬松毛 -->
          <path d="M140 175 Q170 195 200 175 Q195 205 170 210 Q145 205 140 175 Z" fill="#FFF9E0" opacity="0.9"/>

          <!-- 前爪 -->
          <ellipse cx="130" cy="255" rx="20" ry="14" fill="url(#puppyEar)" stroke="#C9A63B" stroke-width="2.5"/>
          <ellipse cx="210" cy="255" rx="20" ry="14" fill="url(#puppyEar)" stroke="#C9A63B" stroke-width="2.5"/>
          <!-- 爪印 -->
          <ellipse cx="130" cy="258" rx="8" ry="5" fill="#FFF0C0" opacity="0.7"/>
          <ellipse cx="210" cy="258" rx="8" ry="5" fill="#FFF0C0" opacity="0.7"/>

          <!-- 头（圆润） -->
          <circle cx="170" cy="120" r="68" fill="url(#puppyHead)" stroke="#C9A63B" stroke-width="3"/>
          <!-- 头顶绒毛 -->
          <path d="M145 65 Q170 40 195 65" stroke="#E0B85A" stroke-width="4" fill="none" stroke-linecap="round"/>
          <path d="M155 55 Q170 35 185 55" stroke="#E0B85A" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>

          <!-- 耳朵（下垂蓬松） -->
          <path d="M110 90 Q90 130 105 165 Q115 170 125 160 Q115 130 125 100 Z" fill="url(#puppyEar)" stroke="#C9A63B" stroke-width="3"/>
          <path d="M230 90 Q250 130 235 165 Q225 170 215 160 Q225 130 215 100 Z" fill="url(#puppyEar)" stroke="#C9A63B" stroke-width="3"/>
          <path d="M112 100 Q100 130 110 155" stroke="#FFF0C0" stroke-width="2" fill="none" opacity="0.5"/>
          <path d="M228 100 Q240 130 230 155" stroke="#FFF0C0" stroke-width="2" fill="none" opacity="0.5"/>

          <!-- 眼睛（水汪汪） -->
          <ellipse cx="145" cy="115" rx="13" ry="15" fill="url(#puppyEye)"/>
          <ellipse cx="195" cy="115" rx="13" ry="15" fill="url(#puppyEye)"/>
          <!-- 高光 -->
          <circle cx="141" cy="110" r="5" fill="white"/>
          <circle cx="191" cy="110" r="5" fill="white"/>
          <circle cx="149" cy="120" r="2.5" fill="white" opacity="0.8"/>
          <circle cx="199" cy="120" r="2.5" fill="white" opacity="0.8"/>
          <!-- 下睫毛/眼线 -->
          <path d="M135 125 Q145 130 155 125" stroke="#3D2B0A" stroke-width="1.5" fill="none" opacity="0.6"/>
          <path d="M185 125 Q195 130 205 125" stroke="#3D2B0A" stroke-width="1.5" fill="none" opacity="0.6"/>

          <!-- 腮红 -->
          <ellipse cx="125" cy="135" rx="12" ry="7" fill="#FFB7C5" opacity="0.55"/>
          <ellipse cx="215" cy="135" rx="12" ry="7" fill="#FFB7C5" opacity="0.55"/>

          <!-- 鼻子 -->
          <ellipse cx="170" cy="138" rx="13" ry="10" fill="url(#puppyNose)"/>
          <ellipse cx="166" cy="134" rx="3.5" ry="2.5" fill="#FFF0C0" opacity="0.6"/>

          <!-- 嘴（微笑） -->
          <path d="M155 152 Q170 165 185 152" stroke="#5A3E0A" stroke-width="4" fill="none" stroke-linecap="round"/>
          <!-- 舌头 -->
          <ellipse cx="170" cy="163" rx="7" ry="10" fill="url(#puppyTongue)" stroke="#E06A85" stroke-width="1.5"/>
          <path d="M170 156 L170 168" stroke="#E06A85" stroke-width="1" opacity="0.5"/>

          <!-- 胡须 -->
          <path d="M130 145 L110 140" stroke="#C9A63B" stroke-width="1.5" opacity="0.6"/>
          <path d="M130 150 L108 150" stroke="#C9A63B" stroke-width="1.5" opacity="0.6"/>
          <path d="M210 145 L230 140" stroke="#C9A63B" stroke-width="1.5" opacity="0.6"/>
          <path d="M210 150 L232 150" stroke="#C9A63B" stroke-width="1.5" opacity="0.6"/>

          <!-- 周围小爱心 -->
          <path d="M280 70 Q288 55 296 70 Q288 85 280 70" fill="#FFD966" opacity="0.9"/>
          <path d="M50 100 Q58 85 66 100 Q58 115 50 100" fill="#FFD966" opacity="0.7"/>
          <circle cx="295" cy="130" r="4" fill="#FFE28A" opacity="0.8"/>
          <circle cx="45" cy="160" r="3" fill="#FFE28A" opacity="0.7"/>
        </svg>
      `;
    } else {
      // 精修版男孩立绘 —— 金发温柔少年，保留狗狗耳朵，恋爱感满满
      characterSprite.innerHTML = `
        <svg class="svg-illustration" viewBox="0 0 340 360" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="boySkin" cx="50%" cy="35%" r="60%">
              <stop offset="0%" stop-color="#FFF3E0"/>
              <stop offset="70%" stop-color="#FDE1C6"/>
              <stop offset="100%" stop-color="#F0C9A0"/>
            </radialGradient>
            <radialGradient id="boyHair" cx="50%" cy="30%" r="70%">
              <stop offset="0%" stop-color="#FFE9A8"/>
              <stop offset="60%" stop-color="#F5D98A"/>
              <stop offset="100%" stop-color="#D4A84A"/>
            </radialGradient>
            <radialGradient id="boyEar" cx="50%" cy="50%" r="60%">
              <stop offset="0%" stop-color="#F0D27A"/>
              <stop offset="100%" stop-color="#D4A84A"/>
            </radialGradient>
            <radialGradient id="boyEye" cx="35%" cy="30%" r="70%">
              <stop offset="0%" stop-color="#8B6B2A"/>
              <stop offset="40%" stop-color="#5A3E0A"/>
              <stop offset="100%" stop-color="#2A1C05"/>
            </radialGradient>
            <linearGradient id="boyShirt" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFE9A8"/>
              <stop offset="100%" stop-color="#FFD966"/>
            </linearGradient>
          </defs>

          <!-- 背景光晕 -->
          <circle cx="170" cy="180" r="130" fill="#FFF9E0" opacity="0.4"/>

          <!-- 身体/衬衫 -->
          <path d="M110 200 Q110 175 145 170 L195 170 Q230 175 230 200 L235 300 Q235 320 215 320 L125 320 Q105 320 105 300 Z" fill="url(#boyShirt)" stroke="#C9A63B" stroke-width="3"/>
          <!-- 领口 -->
          <path d="M145 170 Q170 190 195 170" stroke="#C9A63B" stroke-width="3" fill="none"/>
          <!-- 衣服褶皱 -->
          <path d="M130 230 Q170 240 210 230" stroke="#E0B85A" stroke-width="2" fill="none" opacity="0.5"/>
          <path d="M135 270 Q170 280 205 270" stroke="#E0B85A" stroke-width="2" fill="none" opacity="0.5"/>

          <!-- 脖子 -->
          <path d="M150 155 L150 175 Q170 185 190 175 L190 155" fill="#FDE1C6" stroke="#D4A84A" stroke-width="2"/>

          <!-- 头部 -->
          <ellipse cx="170" cy="110" rx="62" ry="68" fill="url(#boySkin)" stroke="#D4A84A" stroke-width="2.5"/>

          <!-- 头发（层次金发） -->
          <path d="M110 95 Q115 45 170 35 Q225 45 230 95 Q235 115 225 130 Q215 105 195 95 Q185 80 170 85 Q155 80 145 95 Q125 105 115 130 Q105 115 110 95 Z" fill="url(#boyHair)" stroke="#C9A63B" stroke-width="2.5"/>

  function renderScene() {
    if (state.phase === 'puppy') {
      if (state.transformed === false) {
        sceneTitle.textContent = '🐶 小狗汪汪 · 温暖的小家';
      }
    } else {
      sceneTitle.textContent = '🌟 他变成了人 · 恋爱开始';
    }
    renderCharacter();
    renderButtons();
    updateStatsUI();
  }

  resetBtn.addEventListener('click', resetGame);

    resetGame();
  }

  initGame();

  window.addEventListener('load', () => {
